spring.application.name=shipment_tracking

server.port=8080

# PostgreSQL - use env vars in production (e.g. DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=jdbc:postgresql://localhost:5432/shipment_tracking_db
spring.datasource.username=postgres
spring.datasource.password=anmol2003
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect